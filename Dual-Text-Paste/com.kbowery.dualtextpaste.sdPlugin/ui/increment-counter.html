
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Dual Text Paste Settings</title>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
    <sdpi-item label="Short-press text (fallback)">
        <sdpi-textarea
            setting="shortText"
            placeholder="Plain text for a quick tap"
            rows="3">
        </sdpi-textarea>
    </sdpi-item>

    <sdpi-item label="Short-press HTML (optional)">
        <sdpi-textarea
            setting="shortHtml"
            placeholder="Optional HTML, e.g. colored text"
            rows="4">
        </sdpi-textarea>
    </sdpi-item>

    <sdpi-item label="Long-press text (fallback)">
        <sdpi-textarea
            setting="longText"
            placeholder="Plain text for a long hold"
            rows="3">
        </sdpi-textarea>
    </sdpi-item>

    <sdpi-item label="Long-press HTML (optional)">
        <sdpi-textarea
            setting="longHtml"
            placeholder="Optional HTML, e.g. colored text"
            rows="4">
        </sdpi-textarea>
    </sdpi-item>

    <sdpi-item label="Long-press threshold (ms)">
        <sdpi-range
            setting="longPressMs"
            min="300"
            max="1500"
            step="100"
            default="600"
            showlabels>
        </sdpi-range>
    </sdpi-item>

    <sdpi-item label="Behavior">
        <div>HTML fields are optional. When provided, HTML formatting is copied along with the plain-text fallback. Release the key to paste.</div>
    </sdpi-item>
</body>
</html>
